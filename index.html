<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture your thoughts, organize by category, and find what you need instantly.</p>
    </header>

    <main>
      <!-- Section 1: Add a note -->
      <section class="section-card">
        <h2>Add a note</h2>
        <form id="note-form">
          <div class="form-group">
            <label for="note-input">Note Text:</label>
            <input
              type="text"
              id="note-input"
              placeholder="What's on your mind? (max 200 characters)"
            />
          </div>

          <div class="form-group">
            <label for="note-category">Category:</label>
            <select id="note-category">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="study">Study</option>
            </select>
          </div>

          <button type="submit">Add Note</button>
        </form>

        <p id="error-message"></p>
      </section>

      <!-- Section 2: Your notes -->
      <section class="section-card">
        <h2>Your notes</h2>
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            placeholder="Search notes by keyword..."
          />
        </div>

        <p id="note-count">You have no notes yet.</p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built with semantic HTML5, CSS and JavaScript.</p>
    </footer>
  </body>
</html>
